# MANUAL: one TOML per map. Unknown keys are rejected. Paths are relative to this file.
[project]
name = "espoo_poc"
output_dir = "../output/espoo_poc"

[input]
dem = "../data/espoo_dem2m.tif"
center_lat = 60.213737
center_lon = 24.768206
size_m = 1000

[terrain]
interval_m = 2.5
blur_sigma_mm = 0.5
smooth_radius_mm = 0.3
simplify_mm = 0.05

[model]
scale = 5000
thickness_mm = 1.5   # measure the actual sheet; it sets stack height and panel profile
k = 3

[fabrication]
min_width_mm = 1.0
min_area_mm2 = 4.0
guide_inset_mm = 0.4
id_height_mm = 2.0
id_min_height_mm = 1.2
blank_width_mm = 800
blank_height_mm = 600
blank_margin_mm = 10
tab_width_mm = 0.5                  # uncut gap in the path; real bridge is ~one kerf narrower
tab_angles_deg = [0, 120, 240]      # 0 = east, counter-clockwise
tab_max_area_mm2 = 200000000              # only small pieces get tabs; set huge to tab everything

[features]
# MANUAL: cached by `mapcut fetch`; remove a line to disable that feature.
buildings = "../data/espoo_buildings.gpkg"
roads = "../data/espoo_roads.gpkg"
road_classes = [12111, 12112, 12121, 12122, 12131, 12132]   # main roads + streets
min_building_mm2 = 1.0
feature_clearance_mm = 0.2
